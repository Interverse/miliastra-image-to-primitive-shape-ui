      worker.onmessage=({data})=>{if(data.type==='error'){worker.terminate();reject(Error(data.message));}if(data.type==='progress'&&data.step===1){worker.terminate();resolve(data.total);}};
      const rgba=largeInput.rgba.slice().buffer;
      worker.postMessage({cmd:'process',jobId:'large-count',rgba,width:64,height:64,config:{primeval_speed:profile,allowed_shapes:['triangle'],num_primitives:150000}},[rgba]);
    });
    check(nativeCount===150000,profile+' starts all requested shapes above its old 100K cap, then cancels');
  }
  $('outlineLink').click();check(!$('primitiveListSection').hidden&&$('fillShapeSection').hidden,'decoration layout remains available');
  for(const shape of ['circle','triangle','rect']){
    const result=await new Promise((resolve,reject)=>{
      const worker=new w.Worker('/js/worker-primeval.js');
      worker.onerror=e=>{worker.terminate();reject(Error(e.message));};
      worker.onmessage=({data})=>{if(data.type==='error'){worker.terminate();reject(Error(data.message));}if(data.type==='done'){worker.terminate();resolve(data.result);}};
      worker.postMessage({cmd:'process',jobId:'background',rgba:new Uint8Array(16*16*4).buffer,width:16,height:16,config:{num_primitives:1,allowed_shapes:[shape],enable_png_mode:false,background_color:'#2257c9',primeval_resolution:32}});
    });
    const png=await w.PNGDecode.decode(new Uint8Array(result.primeval_png));
    check(png.rgba.every((v,i)=>v===[34,87,201,255][i%4]),'chosen background in native PNG '+shape);
    check(result.elements[0].is_background&&result.elements[0].color==='#2257c9'&&result.elements[0].alpha===1,'chosen background in exported controls '+shape);
    check(result.primeval_svg.includes('#2257c9')&&result.config.background_color==='#2257c9','chosen background in SVG and saved config '+shape);
  }
  $('homeLink').click();change('fitMethod','primeval');change('primevalSpeed','turbo');$('shapeMixed').click();$('numPrimsManual').value='8';$('primevalResolution').value='64';
  if($('fillShapeSection').hidden)$('outlineLink').click();
  const parallelJobs=new Map(),parallelPost=w.Worker.prototype.postMessage;let completedParallel=0;
  w.Worker.prototype.postMessage=function(message,...args){if(message.cmd==='process'){parallelJobs.set(message.jobId,message.config.primeval_threads);this.addEventListener('message',({data})=>{if(data.type==='done')completedParallel++;});}return parallelPost.call(this,message,...args);};
  await upload();await upload();$('btnSubmit').click();await wait(()=>parallelJobs.size>=2||errors.length||d.querySelector('.job-error'));
  check(parallelJobs.size===2&&completedParallel===0,'two Primeval jobs dispatched before either completes');
  check([...parallelJobs.values()].every(n=>n>=1&&n<=Math.max(1,Math.floor(w.navigator.hardwareConcurrency/2))),'parallel jobs share the CPU thread budget '+JSON.stringify({threads:[...parallelJobs.values()],hardware:w.navigator.hardwareConcurrency}));
  await wait(()=>completedParallel===2||errors.length||d.querySelector('.job-error'));w.Worker.prototype.postMessage=parallelPost;
  check(completedParallel===2&&!errors.length&&!d.querySelector('.job-error'),'both parallel jobs finish successfully');
  $('outlineLink').click();
  $('classicToolTab').click();check(d.querySelector('#viewClassic.active'),'GIA conversion page remains available');
  check(!errors.length,'no runtime errors');document.querySelector('#status').textContent='PASS · '+messages.length+' fitting checks';document.body.dataset.result='pass';
 }catch(error){report.textContent+='\nFAIL '+error.stack;document.querySelector('#status').textContent='FAIL';document.body.dataset.result='fail';}
});
</script></html>
