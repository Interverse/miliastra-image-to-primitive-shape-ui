name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check runtime dependencies and prepare site
        run: python scripts/prepare-pages.py

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ".pages-site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
