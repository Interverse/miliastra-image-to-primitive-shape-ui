# (aarch64, x86_64, wasm32): see the `# Arithmetic` section of
# `src/joint.rs`. Tests and benches may use these methods as references:
# `src/lib.rs` allows the lint for test builds and for the benches module only,
# so every clippy pass, `--all-features` included, checks the rest.
