[package]
name = "primeval-node"
version.workspace = true
edition = "2024"
repository.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
napi = { version = "3.14.2", features = ["napi6", "tokio_rt"] }
napi-derive = "3.6.12"
primeval-js = { path = "../crates/primeval-js" }
primeval-render = { path = "../crates/primeval-render" }

[build-dependencies]
napi-build = "2.6.0"

[features]
asset-triangle = ["primeval-render/asset-triangle"]
